[build-system]
requires = [
    "setuptools>=82.0.1",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "lmlite"
description = "Browser-native LLM orchestration in JupyterLite"
readme = "README.md"
authors = [ {name = "Emmanuel Decitre", email = "590094+decitre@users.noreply.github.com"} ]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: WebAssembly :: Emscripten",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "ipywidgets",
    "tqdm"
]
dynamic = ["version"]

[project.scripts]
lmlite-models = "lmlite.model_assets:main"

[tool.setuptools.dynamic]
version = {attr = "lmlite.__version__"}

[project.urls]
repository = "https://github.com/decitre/lmlite"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"lmlite" = [
    "*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-ra -q"
markers = ["browser: requires a real browser and network access to load models"]
testpaths = [
    "tests",
]
norecursedirs = [
    "workspace",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
omit = [ ]

[tool.ruff]
line-length = 120
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.src]
root = "src"
include = ["src"]

[bumpver]
current_version = "0.7.0"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"',
]
"src/lmlite/version.py" = [
    '__version__ = "{version}"'
]
"README.md" = [
    '^Package version: `{version}`$'
]


[tool.pixi.workspace]
name = "lmlite"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
xeus-python = "*"
uv = "*"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"
twine = "*"
nodejs = ">=22,<23"

[tool.pixi.feature.dev.pypi-dependencies]
bumpver = "*"
huggingface_hub = "*"
build = "*"
twine = "*"
playwright = "==1.63.0"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.model-fixture]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.model-fixture.pypi-dependencies]
torch = "==2.8.0"
transformers = "==4.57.1"
onnx = "==1.19.1"
onnxruntime = "==1.23.2"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = ["dev"]
model-fixture = ["dev", "model-fixture"]
py311 = ["py311", "dev"]
py312 = ["py312", "dev"]
py313 = ["py313", "dev"]

[tool.pixi.pypi-dependencies]
lmlite = { path = ".", editable = true }

[tool.pixi.tasks]
set-version = { cmd = "python scripts/set_version.py {{ version }}", args = ["version"] }
hf = { cmd = "hf download {{ model }} --local-dir ./models/{{ model }}", args = ["model"] }
tests = "pytest tests -vv --full-trace -m 'not browser' --ignore=tests/browser"
all-tests = "pixi run --environment py311 tests; pixi run --environment py312 tests; pixi run --environment py313 tests"
js-tests = "CI=1 npm run test:js"
js-coverage = "CI=1 npm run test:js:coverage"
install-browser = "python -m playwright install chromium"
model-smoke = "pytest tests/browser/test_model_loading.py -m browser -v"
embedding-smoke = "pytest tests/browser/test_embeddings.py -m browser -v"
task-smoke = "pytest tests/browser/test_tasks.py -m browser -v"
generate-embedding-fixture = "python scripts/generate_embedding_fixture.py"
coverage = "coverage run -m pytest --ignore=tests/test_notebooks.py --ignore=tests/browser -m 'not browser' && coverage report -m"
lint = "ruff check src tests scripts --fix && ruff format src tests scripts"
lint-check = "ruff check src tests scripts && ruff format src tests scripts --check"
wheel = "rm -rf dist build; python -m build --sdist --wheel"
twine = "twine upload dist/*"
jupyterlite = { cmd = ["bash", "scripts/lite-build.sh"] }
bumpver = "bumpver update --set-version"
