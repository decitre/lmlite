# This workflow installs dependencies via pixi and runs tests, lint and coverage.
# See https://pixi.prefix.dev/latest/integration/ci/github_actions/

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * *"

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # https://github.com/actions/checkout
      # https://github.com/prefix-dev/setup-pixi
      # https://github.com/codecov/codecov-action
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: py311 py312 py313

      - name: Test (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: pixi run all-tests

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: pixi run --environment py313 lint-check

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: pixi run --environment py313 -- pytest -v --cov=src tests --ignore=tests/test_notebooks.py --ignore=tests/browser --cov-report=xml --cov-report=term-missing

      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install
          CI=1 npm run test:js:coverage

      - name: Upload Python Coverage to Codecov
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload JS Coverage to Codecov
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: javascript
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  embedding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      LMLITE_TEST_EMBEDDING_MODEL: "lmlite/tiny-bert"
      LMLITE_TEST_EMBEDDING_BACKEND: "wasm"
      LMLITE_MODEL_TIMEOUT_MS: "180000"
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pixi install

      - name: Run embedding smoke tests
        run: pixi run embedding-smoke --junitxml=embedding-smoke.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-smoke-results
          path: embedding-smoke.xml
          retention-days: 7

  pages-build:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/upload-pages-artifact
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default

      - name: Create page
        run: |
          pixi run jupyterlite || true
          ls -la workspace
          mv workspace/public .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: pages-build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/deploy-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
